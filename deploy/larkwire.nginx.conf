# larkwire.kowems.site —— 灵鹊公网入口
# 变更（2026-09-27 公测）：
#   ① /ws 不变（中继 WebSocket）
#   ② /pair 不变（配对落地页）
#   ③ 新增 / 官网首页（原为 return 204）
#   ④ 新增 /.well-known/apple-app-site-association（Universal Link）
#   ⑤ 新增 /dl/ Android APK 下载区
# 部署：先 cp 备份现配置 → nginx -t → reload（不断 ws）
server {
    server_name larkwire.kowems.site;

    # 静态资产根（官网首页 / pair / AASA / dl 共用）
    root /opt/larkwire-relay/www;

    location /ws {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket 长连接：应用层 25s 心跳已上线，3600s 为双保险
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 配对落地页：微信扫码 → 蒙层引导浏览器打开 → scheme 拉起 App
    location /pair {
        try_files /pair/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # AASA：iOS Universal Link 凭证（Apple CDN 抓取，要求 JSON content-type）
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    # Android APK 下载区
    location /dl/ {
        types {
            application/vnd.android.package-archive apk;
            application/x-apple-diskimage dmg;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # 官网首页
    location / {
        try_files /index.html =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/larkwire.kowems.site/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/larkwire.kowems.site/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = larkwire.kowems.site) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name larkwire.kowems.site;
    return 404; # managed by Certbot


}
